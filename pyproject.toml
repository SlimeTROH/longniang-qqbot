[project]
name = "qqbot"
version = "0.1.0"
description = "QQ 机器人（NoneBot2 + NapCat），支持远程操控 DSH"
requires-python = ">=3.9"
dependencies = [
    "nonebot2>=2.5.0",
    "nonebot-adapter-onebot>=2.4.6",
    "Pillow>=10.4",
    "playwright==1.65.2",
]

# ---------------------------------------------------------------
# 构建后端：nb-cli 会用 `pip install -e .` 来同步依赖，需要这一节。
# ---------------------------------------------------------------
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# 这个项目是「应用」而不是「库」：入口是 bot.py，代码靠 bot.py 直接加载，
# 不需要把自己安装成 Python 包。
#
# 关键：必须显式声明，否则 setuptools 的自动发现会看到
# logs/、state/、plugins/ 三个顶层目录，报
# "Multiple top-level packages discovered in a flat-layout"。
[tool.setuptools]
packages = []

# ---------------------------------------------------------------
# NoneBot / nb-cli 配置
# ---------------------------------------------------------------
[tool.nonebot]
plugin_dirs = ["plugins"]
builtin_plugins = []

[tool.nonebot.plugins]
"@local" = []

[tool.nonebot.adapters]
"@local" = []
nonebot-adapter-onebot = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
]
